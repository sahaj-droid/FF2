<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidhya | Learning Mitra</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #fbbf24;
            --science: #0d9488;
        }
        /* ... Apply CSS variables to your existing selectors ... */
    </style>
</head>
<body>
    <main id="app-root"></main>

    <script type="module">
        /**
         * State Manager: Centralized source of truth
         */
        const State = {
            history: ['home'],
            settings: {
                apiKey: localStorage.getItem('vidhya_key') || '',
            },
            update(key, value) {
                this[key] = value;
                this.render();
            }
        };

        /**
         * Router: Handles view transitions without hardcoding DOM manipulation
         */
        const Router = {
            views: {
                home: () => `<h1>Home Dashboard</h1>...`,
                chapter: (id) => `<h2>Chapter ${id}</h2>...`
            },
            render(viewId, data) {
                const root = document.getElementById('app-root');
                root.innerHTML = this.views[viewId](data);
            }
        };

        // Initialize App
        const init = () => {
            // Check for API key logic
            if(!State.settings.apiKey) { /* Open Modal */ }
            Router.render('home');
        };

        init();
    </script>
</body>
</html>
